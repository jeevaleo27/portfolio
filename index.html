<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/portfolio/Jeeva.jpg" />
  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    >
  </noscript>
  
  <!-- SEO Utama -->
  <title>Jeeva Kaleeswar – Full Stack Developer</title>
  <meta name="description" content="The official website of Jeeva kaleeswar, a front-end web developer. I focus on creating engaging digital experiences and always strive to deliver the best solutions for every project I work on." />
  <meta name="keywords" content="Jeeva kaleeswar, Front-End Web Developer, Portofolio Jeeva" />
  <meta name="author" content="Jeeva kaleeswar" />

  <!-- GitHub Pages SPA redirect handler -->
  <script>
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    }(window.location));
  </script>

  <!-- Google Search Console -->


  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%APP_URL%/" />
  <meta property="og:title" content="Jeeva Kaleeswar | Front-End Web Developer" />
  <meta property="og:description" content="Jeeva Kaleeswar's official website and portfolio, Front-End Web Developer." />
  <meta property="og:image" content="%APP_URL%/Meta.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="%APP_URL%/" />
  <meta name="twitter:title" content="Jeeva Kaleeswar | Front-End Web Developer" />
  <meta name="twitter:description" content="Jeeva Kaleeswar's official website and portfolio." />
  <meta name="twitter:image" content="%APP_URL%/Meta.png" />

  <!-- Canonical -->
  <link rel="canonical" href="%APP_URL%/" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jeeva kaleeswar",
    "url": "%APP_URL%",
    "image": "%APP_URL%/Photo.jpg",
    "jobTitle": "Front-End Web Developer",
    "description": "I focus on creating engaging digital experiences and always strive to deliver the best solutions for every project I work .",
    "sameAs": [
      "https://www.linkedin.com/in/jeeva-kaleeswar2710/",
      "https://www.instagram.com/_call_me_p_o_p_e_y_e__",
     "https://github.com/jeevaleo27",
    ]
  }
  </script>
</head>

<body>
  <!-- Konten teks penting untuk SEO -->
  <header style="display:none">
    <h1>Jeeva kaleeswar</h1>
    <p>
      I focus on creating engaging digital experiences and always strive to deliver the best solutions for every project I work .
    </p>
  </header>

  <!-- Root React -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
